version: 2
updates:
  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    schedule:
      interval: "weekly"

  # Enable version updates for Cargo
    groups:
      github-actions:
        patterns:
          - '*'
  - package-ecosystem: "cargo"
    directory: "/"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "cargo"
    schedule:
      interval: "daily"
  - package-ecosystem: rust-toolchain
    directory: /
    labels:
      - dependencies
      - rust-toolchain
    schedule:
      interval: weekly
